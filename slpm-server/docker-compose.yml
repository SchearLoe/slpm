# 备选方案：用 Docker 运行 PostgreSQL
# 适用：本机未装 PostgreSQL，或想用容器隔离环境
#
# 用法（需先安装 Docker Desktop）：
#   docker compose up -d        启动 PostgreSQL
#   docker compose down          停止
#
# 启动后，把 slpm-server/.env 的 DATABASE_URL 改为：
#   postgresql://slpm:slpm123@localhost:5432/slpm?schema=public

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: slpm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: slpm
      POSTGRES_PASSWORD: slpm123
      POSTGRES_DB: slpm
    ports:
      - '5432:5432'
    volumes:
      - slpm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slpm -d slpm']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  slpm_pgdata:
